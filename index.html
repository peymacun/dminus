<!doctype html>
<html lang="x-default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>dMinus</title>
  <link rel="alternate" hreflang="de" href="https://dminus.co/de/">
  <link rel="alternate" hreflang="en" href="https://dminus.co/en/">
  <link rel="alternate" hreflang="tr" href="https://dminus.co/tr/">
  <link rel="alternate" hreflang="x-default" href="https://dminus.co/">
  <script>
  (() => {
    const stored = localStorage.getItem("dminus-language");
    const langs = navigator.languages || [navigator.language || "de"];
    const primary = stored || (langs.find(x => /^tr\b/i.test(x)) ? "tr" :
                              langs.find(x => /^en\b/i.test(x)) ? "en" : "de");
    location.replace("/" + primary + "/");
  })();
  </script>
</head>
<body></body>
</html>
